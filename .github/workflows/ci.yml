name: CI

# Architectural principles (see ClearWater design docs):
#   #4 Windows is the primary deployment platform
#   #5 HPC/Linux is first-class
# macOS is included because it is the project author's primary dev platform.

on:
  push:
    branches: [streaming]
  pull_request:
    branches: [streaming, main]

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
            pip-${{ runner.os }}-

      - name: Upgrade pip toolchain
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install package in editable mode
        run: python -m pip install -e .

      # Phase I-6 (2026-05-21): import-time smoke test. Catches the
      # G-1/G-2-class import defects that have bitten ClearWater-
      # riverine on a clean install. v3 Processes are intended to be
      # usable standalone, and the Phase I-4/F9 decoupling of
      # ``examples`` from the package init was specifically motivated
      # by this concern. This step locks the standalone-import
      # contract.
      - name: Import-time smoke test
        run: |
          python -c "import clearwater_modules_v3; print('clearwater_modules_v3 imports')"
          python -c "from clearwater_modules_v3 import Temperature, DOX, Nitrogen, Phosphorus, Carbon, N2, FloatingAlgae, BenthicAlgae, CBOD, POM, Pathogen, Alkalinity, Model; print('all 11 v3 processes + Model importable from package root')"
          python -c "from clearwater_modules_v3.utils.reaeration import kah_20, kaw_20, ka_tc; print('reaeration utils OK')"

      # Test-only deps not declared in pyproject.toml.
      # numba is imported transitively via clearwater_modules.utils;
      # tests/conftest.py loads clearwater_modules.shared.types which
      # pulls in the numba-using modules.
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov pandas numba

      - name: Show installed packages
        run: python -m pip list

      # tests/unit/ targets the unreleased clearwater_modules_v2 namespace
      # (vendored from a sibling repo) and is not part of CI.
      # test_5_tsm_calculations_v2.py is an unfinished stub missing its imports.
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/unit --ignore=tests/test_5_tsm_calculations_v2.py
