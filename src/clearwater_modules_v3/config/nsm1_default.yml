# v3 NSM1 default configuration (Phase 8.A, v3 NSM1 implementation plan).
#
# This YAML declares all 11 v3 NSM1 Process classes with sensible default
# parameters. It is the canonical "ships-with-v3" NSM1 entry point referenced
# by the v3 NSM1 design specification (Section 14: resolved Q "default YAML").
# It mirrors the headless Python builder ``build_nsm1_demo``
# (``src/clearwater_modules_v3/examples/nsm1_demo_setup.py``) and the demo
# notebook ``examples/V3/04_Example_NSM1.ipynb``.
#
# Builds, but is a template for *running*. ``init_from_file`` constructs a
# Model directly from this file: every parameter block loads and all 11
# processes are built (guarded by ``tests/v3/test_nsm1_default_config.py``).
# It does not register any state, so ``data_sources`` and ``variable_map``
# ship empty here. The 11 processes read 16 state variables and 4 forcings
# (water_temperature, depth, solar_radiation, atmospheric_pressure) that
# nothing in this file provides, so calling ``model.run()`` on the file
# as-shipped raises a clear ``Process input(s) have no provider: ...`` error
# naming every unwired input. Wire a data layer first, using one of:
#
# 1. Pair with a Riverine ``configuration_path``: add a ``riverine:`` block to
#    ``processes:`` and point its ``data_sources`` / ``variable_map`` at the
#    HEC-RAS mesh. The Riverine bridge registers the transport state each
#    step. This is the production path (Sumwere Creek and other riverine runs).
#
# 2. Populate ``data_sources`` / ``variable_map`` below with a provider for
#    each state and forcing (e.g. ``{provider: float, ...}`` constants, or
#    dataset/CSV-backed providers). The Python builder ``build_nsm1_demo`` does
#    the in-memory equivalent against a synthetic registry and is the verified
#    headless, no-files path; it constructs the same logical Model this YAML
#    describes.
#
# Parameter convention: each process nests its parameters under ``parameters:``
# (see ``dox`` / ``n2`` below), which the config factory passes straight to the
# Process constructor. The blocks below are the authoritative reference for
# "what NSM1 looks like with v3 defaults" — copy them into your own YAML when
# promoting from a demo to a real simulation.

model:
  start_datetime: '2026-01-01 00:00:00'
  end_datetime:   '2026-01-01 06:00:00'
  time_step: '5min'
  simulation_directory: '.'
  output_variables: []  # populate as needed; empty disables zarr output

processes:

  # FloatingAlgae - phytoplankton biomass (algae_floating, ug-Chla/L).
  - floating_algae: {}

  # BenthicAlgae - benthic algal mat (benthic_algae, g-D/m^2).
  - benthic_algae: {}

  # Nitrogen - ammonium / nitrate / organic_nitrogen (mg-N/L).
  - nitrogen: {}

  # Phosphorus - tip / organic_phosphorus (mg-P/L). Note: the canonical
  # v3 inorganic-P state name is "tip"; the v2 algae overlays now
  # consume "tip" directly (Phase 8.A Fix 2).
  - phosphorus: {}

  # Carbon - poc / doc / dic (mg-C/L).
  - carbon: {}

  # POM - particulate organic matter (mg/L).
  - pom: {}

  # CBOD - carbonaceous biochemical oxygen demand (mg-O2/L).
  - cbod: {}

  # DOX - dissolved oxygen (oxygen_dissolved, mg-O2/L).
  # Hydraulic reaeration enabled with kah_20_user=20 1/d so air-water
  # exchange can balance algal photosynthesis at typical solar forcing.
  # The v3 default kah_20_user=0.0 disables reaeration and would let
  # DOX accumulate non-physically in a closed-box demo.
  - dox:
      parameters:
        pressure_mb: 1013.25
        kah_20_user: 20.0
        hydraulic_reaeration_option: 1

  # N2 - dissolved dinitrogen / total dissolved gas (mg-N/L).
  - n2:
      parameters:
        pressure_mb: 1013.25

  # Pathogen - pathogen indicator (count/100mL, relative).
  - pathogen: {}

  # Alkalinity - alkalinity (mg-CaCO3/L).
  - alkalinity: {}

# data_sources and variable_map are intentionally left as empty
# templates. Populate them with the Riverine mesh paths or CSV
# providers your simulation requires. When run through the Python
# builder ``build_nsm1_demo`` instead of ``init_from_file``, the
# in-memory registry is pre-populated and these sections are ignored.
data_sources: {}

variable_map: {}
