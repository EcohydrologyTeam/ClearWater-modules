# v3 NSM1 default configuration (Phase 8.A, v3 NSM1 implementation plan).
#
# This YAML declares all 11 v3 NSM1 Process classes with sensible
# default parameters. It is the canonical "ships-with-v3" NSM1 entry
# point referenced by the v3 NSM1 design specification (Section 14:
# resolved Q "default YAML"). It mirrors the headless Python builder in
# ``src/clearwater_modules_v3/examples/nsm1_demo_setup.py`` and the
# Phase 7.C demo notebook ``examples/V3/04_Example_NSM1.ipynb``.
#
# IMPORTANT: this YAML is intentionally a *template*. The v3
# ``init_from_file`` entry point reuses v2 helpers
# (``__init_processes`` and ``__init_model_data``) which require every
# state and forcing variable read by any Process to be wired to a
# ``data_sources`` provider via ``variable_map``. The 11 NSM1 Processes
# read 17 state variables and 4 forcings (water_temperature, depth,
# solar_radiation, atmospheric_pressure); a fully self-contained YAML
# would have to carry CSV files for each one.
#
# Two supported usage patterns:
#
# 1. Pair this YAML with a Riverine ``configuration_path`` that
#    registers the state variables. Add a ``riverine:`` block to the
#    ``processes:`` list and supply the Riverine mesh's CSV inputs in
#    ``data_sources`` and ``variable_map``. This is the production
#    path used by Sumwere Creek and other riverine simulations.
#
# 2. For headless NSM1-only runs (no transport, no I/O), use the
#    Python builder
#    ``clearwater_modules_v3.examples.build_nsm1_demo`` instead of
#    ``init_from_file``. The builder constructs the same logical
#    Model that this YAML describes, but against an in-memory
#    registry pre-populated with synthetic 5-cell initial conditions.
#    No CSV files required.
#
# The Process parameter blocks below are the authoritative reference
# for "what NSM1 looks like with v3 defaults"; copy them into your own
# YAML when promoting from a demo to a real simulation.

model:
  start_datetime: '2026-01-01 00:00:00'
  end_datetime:   '2026-01-01 06:00:00'
  time_step: '5min'
  simulation_directory: '.'
  output_variables: []  # populate as needed; empty disables zarr output

processes:

  # FloatingAlgae - phytoplankton biomass (algae_floating, ug-Chla/L).
  - floating_algae: {}

  # BenthicAlgae - benthic algal mat (benthic_algae, g-D/m^2).
  - benthic_algae: {}

  # Nitrogen - ammonium / nitrate / organic_nitrogen (mg-N/L).
  - nitrogen: {}

  # Phosphorus - tip / organic_phosphorus (mg-P/L). Note: the canonical
  # v3 inorganic-P state name is "tip"; the v2 algae overlays now
  # consume "tip" directly (Phase 8.A Fix 2).
  - phosphorus: {}

  # Carbon - poc / doc / dic (mg-C/L).
  - carbon: {}

  # POM - particulate organic matter (mg/L).
  - pom: {}

  # CBOD - carbonaceous biochemical oxygen demand (mg-O2/L).
  - cbod: {}

  # DOX - dissolved oxygen (oxygen_dissolved, mg-O2/L).
  # Hydraulic reaeration enabled with kah_20_user=20 1/d so air-water
  # exchange can balance algal photosynthesis at typical solar forcing.
  # The v3 default kah_20_user=0.0 disables reaeration and would let
  # DOX accumulate non-physically in a closed-box demo.
  - dox:
      pressure_mb: 1013.25
      kah_20_user: 20.0
      hydraulic_reaeration_option: 1

  # N2 - dissolved dinitrogen / total dissolved gas (mg-N/L).
  - n2:
      pressure_mb: 1013.25

  # Pathogen - pathogen indicator (count/100mL, relative).
  - pathogen: {}

  # Alkalinity - alkalinity (mg-CaCO3/L).
  - alkalinity: {}

# data_sources and variable_map are intentionally left as empty
# templates. Populate them with the Riverine mesh paths or CSV
# providers your simulation requires. When run through the Python
# builder ``build_nsm1_demo`` instead of ``init_from_file``, the
# in-memory registry is pre-populated and these sections are ignored.
data_sources: {}

variable_map: {}
