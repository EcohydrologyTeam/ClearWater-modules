[project]
authors = [{name = "Paul Tomasula", email = "ptomasula@gmail.com"}]
name = "ClearWater-modules"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies=[
    "dask",
    "jupyterlab",
    "numpy",
    "pyyaml",
    "xarray>=2025.8",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.metadata]
allow-direct-references = true

# This repository ships TWO packages from ``src/``: the v1 ``clearwater_modules``
# and ``clearwater_modules_v3``, the Aquatic Processes Library. Hatchling infers
# a single package from the project name when it is not told otherwise, so
# without this list a built wheel contained ``clearwater_modules`` alone and
# ``clearwater_modules_v3`` was absent from it.
#
# Editable installs hid that: they place ``src/`` itself on ``sys.path``, which
# exposes both packages, so every environment built with ``pip install -e``
# worked while every wheel-based install lacked the library. ClearWater-HMS
# consumes the v3 processes and installs this repository non-editable in CI and
# for collaborators, where the missing package raised ModuleNotFoundError at
# import.
[tool.hatch.build.targets.wheel]
packages = ["src/clearwater_modules", "src/clearwater_modules_v3"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# Conda-side dependencies. Mirrors the modules-repo dev-env set so the
# streaming env imports v1, v2, v3, ClearWater-data, and
# ClearWater-Riverine-streaming with the same package versions LimnoTech
# tests against. ``pyproj`` and ``numba`` are explicit (the former so a
# binary wheel against conda's PROJ is preferred over a PyPI source
# build that would need PROJ 9.4+; the latter for v1's kernel
# optimization in ``clearwater_modules.utils``). The visualization
# stack (geoviews, hvplot, panel, jupyterlab, etc.) is included for
# notebook examples and pulls in h5py / geopandas / matplotlib / scipy
# transitively, which clearwater_riverine needs.
[tool.pixi.dependencies]
# Direct runtime deps (clearwater_riverine reads HEC-RAS HDF; v1 uses
# numba; pyproj is a binary dep that needs to come from conda not PyPI).
pyproj = "*"
numba = "*"
h5py = "*"
geopandas = "*"
scipy = "*"
matplotlib = "*"
shapely = "*"
zarr = "*"
netcdf4 = "*"
# Visualization / notebook stack (matches modules-repo dev env).
geoviews = "*"
hvplot = "*"
panel  = "*"
jupyterlab = "*"
jupyterlab-lsp = "*"
ipympl = "*"
ipywidgets = "*"
jupyter_bokeh = "*"
pyviz_comms = "*"
selenium = "*"
geckodriver = "*"
python-lsp-server = "*"
pylsp-mypy = "*"

#[tool.pixi.pypi-dependencies]
#ClearWater-modules = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.pypi-dependencies]
pytest = "*"
clearwater_modules = { path = ".", editable = true}
clearwater_data = { path = "../ClearWater-data", editable = true}
clearwater_riverine = {path = "../ClearWater-riverine", editable=true}

[tool.pixi.tasks]
# Imports clearwater_modules_v3 as well as v1: the task previously checked only
# v1, so it reported a healthy install of a distribution whose wheel was missing
# the Aquatic Processes Library entirely.
verify-install = {cmd = "python -c \"import clearwater_data; import clearwater_riverine; import clearwater_modules; import clearwater_modules_v3;\""}
