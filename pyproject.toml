[project]
name = "clearwater_modules"
description = "Clearwater Python transport model"
authors = [
    {name = "Paul Tomasula", email = "ptomasula@gmail.com"},
    {name = "Isaac", email = ""},
    {name = "Jason M Rutyna", email = "jrutyna@limno.com"},
    {name = "Kelsey", email = ""},
    {name = "Sarah Jordan", email = "sjordan@limno.com"},
    {name = "Anthony Aufdenkampe", email = "aaufdenkampe@limno.com"},
    {name = "Xavier", email = ""},
    {name = "Todd Steissberg", email = "Todd.E.Steissberg@erdc.dren.mil"},
]
dynamic = ["version", "readme"]
requires-python = ">= 3.11"
dependencies=[
    "dask",
    "numpy",
    "pyyaml",
    "xarray",
]


###############
### Build 
###############
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.version]
path = "./src/clearwater_modules_v2/__init__.py"

[tool.hatch.readme]
path = "./README.md"

[tool.hatch.metadata]
allow-direct-references = true


########################
### Pixi 
########################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
# Notebooks & Visualization
geoviews = "*"
hvplot = "*"
panel  = "*"
jupyterlab = "*"
jupyterlab-lsp = "*"
ipympl = "*"
ipywidgets = "*"
jupyter_bokeh = "*"
pyviz_comms = "*"
selenium = "*"
geckodriver = "*"
python-lsp-server = "*"
pylsp-mypy = "*"

[tool.pixi.pypi-dependencies]
clearwater_modules = { path = ".", editable = true }
clearwater_riverine = { path = "../ClearWater-riverine", editable = true }
clearwater_data = { path = "../ClearWater-data", editable = true }


#############################
### Pixi Dev Environment
#############################

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
pyright = "*"
snakeviz = "*"

[tool.pixi.feature.dev.pypi-dependencies]
ClearWater-modules = { path = ".", editable = true }
clearwater_riverine = { path = "../ClearWater-riverine", editable = true }
clearwater_data = { path = "../ClearWater-data", editable = true }

[tool.pixi.tasks]
verify-install = {cmd = "python -c \"import clearwater_data; import clearwater_riverine; import clearwater_modules;\""}

[tool.pytest.ini_options]
addopts = """
    --cov=clearwater_modules_v2
    --cov-report=term-missing
    --cov-report=html
"""
testpaths = ["tests"]
